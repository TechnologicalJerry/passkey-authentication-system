name: Continuous Integration

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, Test & Build (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x]

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: passkey_auth_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d passkey_auth_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: nest-server

    env:
      NODE_ENV: test
      PORT: 3000
      API_PREFIX: api
      API_VERSION: '1'
      DATABASE_HOST: localhost
      DATABASE_PORT: 5432
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgrespassword
      DATABASE_NAME: passkey_auth_test
      DATABASE_SSL: false
      CORS_ORIGINS: http://localhost:3000
      LOG_LEVEL: fatal
      SWAGGER_ENABLED: false
      THROTTLE_TTL: 60
      THROTTLE_LIMIT: 100
      WEBAUTHN_RP_NAME: Passkey Authentication System CI
      WEBAUTHN_RP_ID: localhost
      WEBAUTHN_ORIGINS: http://localhost:3000
      WEBAUTHN_CHALLENGE_TTL_MS: 60000
      WEBAUTHN_USER_VERIFICATION: preferred
      JWT_ACCESS_SECRET: ci-super-secret-jwt-key-minimum-32-characters-long!
      JWT_ACCESS_TTL: 15m
      JWT_ISSUER: passkey-auth-ci
      JWT_AUDIENCE: passkey-auth-users
      SESSION_REFRESH_TOKEN_TTL_DAYS: 7
      SESSION_REFRESH_TOKEN_SECRET: ci-super-secret-refresh-key-minimum-32-characters-long!
      SESSION_MAX_ACTIVE: 5
      SESSION_COOKIE_NAME: refresh_token
      SESSION_COOKIE_SECURE: false
      SESSION_COOKIE_SAME_SITE: lax

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: nest-server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Code formatting check (Prettier)
        run: npx prettier --check "src/**/*.ts" "test/**/*.ts"

      - name: Static lint analysis (Oxlint)
        run: npm run lint

      - name: TypeScript typecheck
        run: npx tsc --noEmit

      - name: Execute unit test suite
        run: npm run test

      - name: Execute database migrations
        run: npm run migration:run

      - name: Execute end-to-end integration suite
        run: npm run test:e2e

      - name: Compile production application bundle
        run: npm run build

  angular-client:
    name: Angular Client Test & Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: angular-client

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: angular-client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Code formatting check (Prettier)
        run: npx prettier --check "src/**/*.ts" "src/**/*.html" "src/**/*.css"

      - name: TypeScript typecheck
        run: npx tsc --noEmit

      - name: Execute Angular unit test suite
        run: npm test -- --watch=false

      - name: Compile production Angular application bundle
        run: npm run build

  docker:
    name: Docker Container Image Verification
    runs-on: ubuntu-latest
    needs: [verify, angular-client]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker container image
        uses: docker/build-push-action@v5
        with:
          context: ./nest-server
          file: ./nest-server/Dockerfile
          push: false
          tags: passkey-auth-backend:ci-test

